<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport with viewport-fit=cover for iOS notch & home bar handling -->
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" 
    />
    
    <title>Local Music Player PWA</title>
    <meta name="description" content="Offline local music player PWA optimized for iOS with background audio playback and infinite looping" />


    <!-- Standard Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- iOS Specific Meta Tags & Apple Touch Icons -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Music Player" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="apple-touch-startup-image" href="/icon.svg" />

    <!-- Android / Chrome Theme Color -->
    <meta name="theme-color" content="#090d16" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#090d16] text-slate-100 antialiased select-none overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
